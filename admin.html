<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <title>应用管理后台</title>
  <link rel="stylesheet" href="admin.css?v=20260827" />
</head>
<body>
  <div class="login-overlay" id="login-overlay">
    <span class="login-orb login-orb-one" aria-hidden="true"></span>
    <span class="login-orb login-orb-two" aria-hidden="true"></span>
    <form class="login-card" id="login-form">
      <div class="login-head">
        <div class="login-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3l7 3v5c0 4.7-3 7.6-7 9-4-1.4-7-4.3-7-9V6l7-3z"></path>
            <path d="M9.5 12l1.7 1.7 3.3-3.7"></path>
          </svg>
        </div>
        <h2>管理后台登录</h2>
        <p>请输入管理员账号和密码继续</p>
      </div>
      <div class="login-body">
        <div class="input-shell">
          <span class="input-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="8" r="4"></circle>
              <path d="M5 21c.7-3.6 3.5-5.5 7-5.5s6.3 1.9 7 5.5"></path>
            </svg>
          </span>
          <input id="login-username" type="text" autocomplete="username" placeholder="账号：admin" />
        </div>
        <div class="input-shell">
          <span class="input-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="10" width="16" height="11" rx="2"></rect>
              <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
            </svg>
          </span>
          <input id="login-password" type="password" autocomplete="current-password" placeholder="请输入密码" />
          <button id="toggle-password" class="password-toggle" type="button" aria-label="显示或隐藏密码">👁️</button>
        </div>
        <p class="login-error" id="login-error" role="alert"></p>
        <button class="login-submit" type="submit">
          <span>登录</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14"></path>
            <path d="M13 6l6 6-6 6"></path>
          </svg>
        </button>
      </div>
    </form>
  </div>

  <header class="admin-header" id="admin-header" hidden>
    <div class="container header-inner">
      <div class="header-title">
        <span class="brand-mark" aria-hidden="true">⚙️</span>
        <div>
          <h1>应用管理后台</h1>
          <p>添加应用的 GitHub Pages 地址，自动生成列表项并发布到主站。</p>
        </div>
      </div>
      <div class="header-actions">
        <button id="logout-button" class="button ghost" type="button">退出登录</button>
        <a class="back-link" href="index.html">返回主站</a>
      </div>
    </div>
  </header>

  <main class="container" id="admin-main" hidden>
    <section class="token-panel">
      <div class="panel-heading">
        <h2>GitHub 访问令牌</h2>
        <span class="muted">保存后，修改才能写回仓库并触发 Pages 构建</span>
      </div>
      <div class="token-row">
        <input id="token-input" type="password" placeholder="粘贴 GitHub Personal Access Token" autocomplete="off" />
        <button id="save-token" class="button secondary" type="button">保存令牌</button>
        <button id="clear-token" class="button ghost" type="button">清除</button>
      </div>
      <p class="token-hint">令牌只保存在当前浏览器的本地存储中，不会写入仓库。建议使用拥有 <code>repo</code> 权限的令牌。</p>
    </section>

    <div class="admin-layout">
      <section class="editor-panel panel">
        <div class="panel-heading">
          <h2 id="form-title">添加应用</h2>
          <span class="muted" id="form-mode">新应用</span>
        </div>

        <div class="field">
          <label for="app-url">GitHub Pages 地址</label>
          <div class="url-row">
            <input id="app-url" type="url" placeholder="https://username.github.io/repo/" />
            <button id="fetch-meta" class="button secondary" type="button">获取信息</button>
          </div>
          <small id="url-message" class="field-message"></small>
        </div>

        <div class="field-grid">
          <div class="field">
            <label for="app-name">应用名称</label>
            <input id="app-name" type="text" placeholder="应用名称" />
          </div>
          <div class="field">
            <label for="app-category">分类</label>
            <input id="app-category" type="text" list="category-options" placeholder="例如：效率工具" />
            <datalist id="category-options"></datalist>
          </div>
        </div>

        <div class="field">
          <label for="app-description">应用简介</label>
          <textarea id="app-description" rows="3" placeholder="一句话介绍这个应用"></textarea>
        </div>

        <div class="field">
          <label for="app-tags">标签</label>
          <input id="app-tags" type="text" placeholder="多个标签用逗号分隔，例如：工具, 开源" />
        </div>

        <div class="field">
          <label for="app-icon">图标</label>
          <div class="icon-row">
            <div class="icon-preview" id="icon-preview">✦</div>
            <input id="app-icon" type="text" placeholder="Emoji 或图片 URL" />
          </div>
          <small class="field-message">可以直接填 Emoji，也可以填图标图片的完整地址。</small>
        </div>

        <div class="form-actions">
          <button id="save-app" class="button primary" type="button">保存应用</button>
          <button id="cancel-edit" class="button ghost" type="button" hidden>取消编辑</button>
        </div>
      </section>

      <section class="list-panel panel">
        <div class="panel-heading">
          <h2>现有应用</h2>
          <span class="muted" id="app-count"></span>
        </div>
        <div id="app-list" class="app-list"></div>
      </section>
    </div>

    <section class="publish-panel panel">
      <div>
        <h2>发布到主站</h2>
        <p class="muted">保存后，GitHub Pages 通常会在几分钟内自动重新构建。</p>
      </div>
      <button id="publish" class="button primary large" type="button">保存全部并发布</button>
    </section>

    <p id="status" class="status" role="status"></p>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var loginForm = document.getElementById("login-form");
      loginForm.addEventListener("submit", function (event) {
        event.preventDefault();
        var username = document.getElementById("login-username").value.trim();
        var password = document.getElementById("login-password").value.trim();
        if (username === "admin" && password === "lyj0514") {
          sessionStorage.setItem("selfapplist_admin_auth", "1");
          document.getElementById("login-overlay").hidden = true;
          document.getElementById("admin-header").hidden = false;
          document.getElementById("admin-main").hidden = false;
          if (typeof window.__showAdmin === "function") {
            window.__showAdmin();
          }
        } else {
          document.getElementById("login-error").textContent = "账号或密码错误，请重试。";
        }
      });
    });
  </script>
  <script src="admin.js?v=20260827"></script>
</body>
</html>
